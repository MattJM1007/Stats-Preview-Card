<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./styles.css" />

    <title>Frontend Mentor | Stats preview card component</title>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Comapny Statistics</h1>

      <div class="card flow-content">
        <div class="card__img">
          <picture>
            <source srcset="images/image-header-desktop.jpg" media="(min-width: 30em)" />
            <img src="./images/image-header-mobile.jpg" alt="people working on laptops and smiling" />
          </picture>
        </div>

        <div class="card__content flow-content">
          <h2 class="title">Get <span class="text-accent">insights</span> that help your business grow.</h2>
          <p class="description text-light">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
          <div class="card__statistics flow-content">
            <h3>10k+ <span class="font-accent text-xlight">companies</span></h3>
            <h3>314 <span class="font-accent text-xlight">templates</span></h3>
            <h3>12m+ <span class="font-accent text-xlight">queries</span></h3>
          </div>
        </div>
      </div>
    </main>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by <a href="https://www.frontendmentor.io/profile/MattJM1007">Matthew Miguel</a>.
    </footer>
  </body>
</html>
